<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Mind Ease</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Profile-themed animated background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        
        .profile-particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .profile-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: profile-float 20s linear infinite;
        }
        
        @keyframes profile-float {
            0% {
                transform: translateY(100vh) translateX(0px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .header-title i {
            font-size: 28px;
            color: #667eea;
        }
        
        .header-title span {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        
        .back-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .profile-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 25px;
            margin-bottom: 25px;
        }
        
        .profile-sidebar {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            height: fit-content;
        }
        
        .profile-main {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .profile-avatar-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .profile-avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
            font-weight: bold;
            margin: 0 auto 20px;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }
        
        .profile-name {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        
        .profile-email {
            color: #666;
            margin-bottom: 15px;
        }
        
        .profile-level {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            display: inline-block;
        }
        
        .quick-stats {
            margin-top: 30px;
        }
        
        .quick-stats h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .stat-item:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            color: #666;
            font-size: 14px;
        }
        
        .stat-value {
            font-weight: bold;
            color: #667eea;
        }
        
        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .form-section {
            margin-bottom: 40px;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        
        .form-group label {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
        }
        
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f8f9fa;
            color: #666;
            border: 2px solid #e0e0e0;
        }
        
        .btn-secondary:hover {
            background: #e9ecef;
            transform: translateY(-1px);
        }
        
        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .achievement-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .achievement-card.earned {
            background: linear-gradient(135deg, #e8f5e8, #d4edda);
            border-color: #28a745;
        }
        
        .achievement-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }
        
        .achievement-icon {
            font-size: 32px;
            margin-bottom: 10px;
            display: block;
        }
        
        .achievement-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .achievement-desc {
            font-size: 12px;
            color: #666;
        }
        
        .badges-section {
            margin-bottom: 40px;
        }
        
        .badges-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        
        .badge-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .badge-card.earned {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .badge-emoji {
            font-size: 24px;
            margin-bottom: 8px;
            display: block;
        }
        
        .badge-title {
            font-weight: 600;
            font-size: 12px;
            margin-bottom: 4px;
        }
        
        .badge-progress {
            font-size: 10px;
            opacity: 0.8;
        }
        
        .status-message {
            padding: 15px 20px;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: 500;
            text-align: center;
        }
        
        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status-loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        @media (max-width: 1024px) {
            .profile-layout {
                grid-template-columns: 1fr;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .achievements-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .badges-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .achievements-grid {
                grid-template-columns: 1fr;
            }
            
            .badges-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- Profile-themed Background -->
    <div class="bg-animation">
        <div class="profile-particles" id="profileParticles"></div>
    </div>

    <div class="container">
        <div class="header">
            <div class="header-title">
                <i class="fas fa-user-circle"></i>
                <span>My Profile</span>
            </div>
            <a href="/main-dashboard" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                Back to Dashboard
            </a>
        </div>

        <div id="statusMessage" class="status-message" style="display: none;"></div>

        <div class="profile-layout">
            <!-- Profile Sidebar -->
            <div class="profile-sidebar">
                <div class="profile-avatar-section">
                    <div class="profile-avatar-large" id="profileAvatarLarge">U</div>
                    <div class="profile-name" id="profileNameDisplay">Loading...</div>
                    <div class="profile-email" id="profileEmailDisplay">Loading...</div>
                    <div class="profile-level" id="profileLevelDisplay">Level 1</div>
                </div>

                <div class="quick-stats">
                    <h3>Quick Stats</h3>
                    <div class="stat-item">
                        <span class="stat-label">Total Entries</span>
                        <span class="stat-value" id="statTotalEntries">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Current Streak</span>
                        <span class="stat-value" id="statCurrentStreak">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Wellness Score</span>
                        <span class="stat-value" id="statWellnessScore">50</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Days Active</span>
                        <span class="stat-value" id="statDaysActive">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Member Since</span>
                        <span class="stat-value" id="statMemberSince">-</span>
                    </div>
                </div>
            </div>

            <!-- Profile Main Content -->
            <div class="profile-main">
                <!-- Personal Information Form -->
                <div class="form-section">
                    <h2 class="section-title">
                        <i class="fas fa-user"></i>
                        Personal Information
                    </h2>
                    
                    <form id="personalInfoForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="firstName">First Name</label>
                                <input type="text" id="firstName" name="firstName" placeholder="Enter your first name">
                            </div>
                            <div class="form-group">
                                <label for="lastName">Last Name</label>
                                <input type="text" id="lastName" name="lastName" placeholder="Enter your last name">
                            </div>
                            <div class="form-group">
                                <label for="dateOfBirth">Date of Birth</label>
                                <input type="date" id="dateOfBirth" name="dateOfBirth">
                            </div>
                            <div class="form-group">
                                <label for="gender">Gender</label>
                                <select id="gender" name="gender">
                                    <option value="">Select Gender</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                    <option value="other">Other</option>
                                    <option value="prefer-not-to-say">Prefer not to say</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone Number</label>
                                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
                            </div>
                            <div class="form-group">
                                <label for="location">Location</label>
                                <input type="text" id="location" name="location" placeholder="City, Country">
                            </div>
                            <div class="form-group full-width">
                                <label for="bio">Bio / About Me</label>
                                <textarea id="bio" name="bio" placeholder="Tell us about yourself, your wellness goals, or anything you'd like to share..."></textarea>
                            </div>
                        </div>
                        
                        <div style="display: flex; gap: 15px; margin-top: 20px;">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i>
                                Save Changes
                            </button>
                            <button type="button" class="btn btn-secondary" onclick="resetForm()">
                                <i class="fas fa-undo"></i>
                                Reset
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Achievements Section -->
                <div class="form-section">
                    <h2 class="section-title">
                        <i class="fas fa-trophy"></i>
                        Achievements
                    </h2>
                    <div class="achievements-grid" id="achievementsGrid">
                        <!-- Achievements will be populated here -->
                    </div>
                </div>

                <!-- Badges Section -->
                <div class="badges-section">
                    <h2 class="section-title">
                        <i class="fas fa-medal"></i>
                        Streak Badges
                    </h2>
                    <div class="badges-grid" id="badgesGrid">
                        <!-- Badges will be populated here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let sessionToken = localStorage.getItem('sessionToken');
        let profileData = null;
        let dashboardStats = null;

        // Check authentication
        if (!sessionToken) {
            showStatus('Please login to view your profile', 'error');
            setTimeout(() => {
                window.location.href = '/';
            }, 2000);
            return;
        }

        document.addEventListener('DOMContentLoaded', function() {
            console.log('Profile page loaded, session token:', !!sessionToken);
            loadProfileData();
            createProfileParticles();
        });

        function showStatus(message, type, duration = 5000) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message status-${type}`;
            statusEl.style.display = 'block';
            
            if (duration > 0) {
                setTimeout(() => {
                    statusEl.style.display = 'none';
                }, duration);
            }
        }

        async function loadProfileData() {
            try {
                showStatus('Loading your profile...', 'loading');

                // Load profile info
                const profileResponse = await fetch('/api/profile', {
                    headers: { 'Authorization': `Bearer ${sessionToken}` }
                });

                if (!profileResponse.ok) {
                    throw new Error('Failed to load profile');
                }

                profileData = await profileResponse.json();
                console.log('Profile data loaded:', profileData);

                // Load dashboard stats
                const statsResponse = await fetch('/api/dashboard-data', {
                    headers: { 'Authorization': `Bearer ${sessionToken}` }
                });

                if (!statsResponse.ok) {
                    throw new Error('Failed to load stats');
                }

                const statsResult = await statsResponse.json();
                dashboardStats = statsResult.data;
                console.log('Dashboard stats loaded:', dashboardStats);

                // Populate profile display
                populateProfileDisplay();
                populatePersonalInfoForm();
                populateAchievements();
                populateBadges();

                document.getElementById('statusMessage').style.display = 'none';

            } catch (error) {
                console.error('Profile loading error:', error);
                showStatus('Error loading profile: ' + error.message, 'error');
            }
        }

        function populateProfileDisplay() {
            if (!profileData || !profileData.profile) {
                console.error('No profile data available');
                showStatus('No profile data available', 'error');
                return;
            }
            
            if (!dashboardStats) {
                console.error('No dashboard stats available');
                showStatus('No dashboard stats available', 'error');
                return;
            }
            
            const profile = profileData.profile;
            console.log('Populating profile display with:', profile);
            console.log('Dashboard stats:', dashboardStats);
            
            // Basic info
            const displayName = profile.name || 'User';
            document.getElementById('profileNameDisplay').textContent = displayName;
            document.getElementById('profileEmailDisplay').textContent = profile.email;
            
            // Avatar
            const avatarInitial = displayName.charAt(0).toUpperCase();
            document.getElementById('profileAvatarLarge').textContent = avatarInitial;
            
            // Level calculation
            const totalEntries = (dashboardStats.moodEntries || 0) + (dashboardStats.journalEntries || 0);
            const level = Math.floor(totalEntries / 10) + 1;
            document.getElementById('profileLevelDisplay').textContent = `Level ${level}`;
            
            // Quick stats
            document.getElementById('statTotalEntries').textContent = totalEntries;
            document.getElementById('statCurrentStreak').textContent = dashboardStats.currentStreak || 0;
            document.getElementById('statWellnessScore').textContent = dashboardStats.wellnessScore || 50;
            
            // Calculate days active (simplified)
            const daysActive = dashboardStats.daysActive || 0;
            document.getElementById('statDaysActive').textContent = daysActive;
            
            // Member since
            const memberSince = new Date(profile.createdAt).toLocaleDateString('en-US', { 
                month: 'short', 
                year: 'numeric' 
            });
            document.getElementById('statMemberSince').textContent = memberSince;
            
            console.log('Profile display populated successfully');
        }

        function populatePersonalInfoForm() {
            const profile = profileData.profile;
            
            // Split name if available
            if (profile.name) {
                const nameParts = profile.name.split(' ');
                document.getElementById('firstName').value = nameParts[0] || '';
                document.getElementById('lastName').value = nameParts.slice(1).join(' ') || '';
            }
            
            // Populate existing fields
            document.getElementById('bio').value = profile.bio || '';
            document.getElementById('phone').value = profile.phone || '';
            
            // Populate new profile fields
            document.getElementById('dateOfBirth').value = profile.dateOfBirth || '';
            document.getElementById('gender').value = profile.gender || '';
            document.getElementById('location').value = profile.location || '';
            
            // If we have separate firstName/lastName fields, use those instead
            if (profile.firstName) {
                document.getElementById('firstName').value = profile.firstName;
            }
            if (profile.lastName) {
                document.getElementById('lastName').value = profile.lastName;
            }
        }

        function populateAchievements() {
            const achievementsContainer = document.getElementById('achievementsGrid');
            const moodEntries = dashboardStats.moodEntries || 0;
            const journalEntries = dashboardStats.journalEntries || 0;
            const wellnessScore = dashboardStats.wellnessScore || 50;
            const totalEntries = moodEntries + journalEntries;

            const achievements = [
                { 
                    title: 'First Steps', 
                    description: 'Logged your first mood entry',
                    requirement: 1,
                    current: moodEntries,
                    emoji: '🎯'
                },
                { 
                    title: 'Getting Started', 
                    description: 'Logged 5 mood entries',
                    requirement: 5,
                    current: moodEntries,
                    emoji: '🌱'
                },
                { 
                    title: 'Mood Tracker', 
                    description: 'Logged 25 mood entries',
                    requirement: 25,
                    current: moodEntries,
                    emoji: '📊'
                },
                { 
                    title: 'Journal Writer', 
                    description: 'Written 10 journal entries',
                    requirement: 10,
                    current: journalEntries,
                    emoji: '📝'
                },
                { 
                    title: 'Wellness Warrior', 
                    description: 'Reached 75+ wellness score',
                    requirement: 75,
                    current: wellnessScore,
                    emoji: '⭐'
                },
                { 
                    title: 'Active User', 
                    description: 'Logged 50 total entries',
                    requirement: 50,
                    current: totalEntries,
                    emoji: '🚀'
                }
            ];

            achievementsContainer.innerHTML = achievements.map(achievement => {
                const isEarned = achievement.current >= achievement.requirement;
                const progressPercent = Math.min((achievement.current / achievement.requirement) * 100, 100);
                
                return `
                    <div class="achievement-card ${isEarned ? 'earned' : ''}">
                        <div class="achievement-icon">${achievement.emoji}</div>
                        <div class="achievement-title">${achievement.title}</div>
                        <div class="achievement-desc">${achievement.description}</div>
                        <div style="margin-top: 8px; font-size: 11px; color: #666;">
                            ${achievement.current}/${achievement.requirement} ${isEarned ? '✓' : `(${Math.round(progressPercent)}%)`}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function populateBadges() {
            const badgesContainer = document.getElementById('badgesGrid');
            const currentStreak = dashboardStats.currentStreak || 0;

            const badges = [
                { title: 'First Step', requirement: 1, emoji: '🎯' },
                { title: '3 Day Fire', requirement: 3, emoji: '🔥' },
                { title: 'Week Warrior', requirement: 7, emoji: '⚡' },
                { title: 'Two Week Champion', requirement: 14, emoji: '💪' },
                { title: 'Month Master', requirement: 30, emoji: '👑' },
                { title: 'Streak Legend', requirement: 50, emoji: '🏆' },
                { title: 'Consistency King', requirement: 100, emoji: '💎' },
                { title: 'Eternal Flame', requirement: 365, emoji: '🌟' }
            ];

            badgesContainer.innerHTML = badges.map(badge => {
                const isEarned = currentStreak >= badge.requirement;
                const progress = Math.min(currentStreak, badge.requirement);
                
                return `
                    <div class="badge-card ${isEarned ? 'earned' : ''}">
                        <div class="badge-emoji">${badge.emoji}</div>
                        <div class="badge-title">${badge.title}</div>
                        <div class="badge-progress">${progress}/${badge.requirement} days</div>
                    </div>
                `;
            }).join('');
        }

        // Form submission
        document.getElementById('personalInfoForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const firstName = formData.get('firstName').trim();
            const lastName = formData.get('lastName').trim();
            const fullName = `${firstName} ${lastName}`.trim();
            
            const profileUpdate = {
                name: fullName || null,
                bio: formData.get('bio').trim() || null,
                phone: formData.get('phone').trim() || null,
                firstName: firstName || null,
                lastName: lastName || null,
                dateOfBirth: formData.get('dateOfBirth') || null,
                gender: formData.get('gender') || null,
                location: formData.get('location').trim() || null
            };').trim() || null
            };
            
            try {
                showStatus('Saving your profile...', 'loading');
                
                const response = await fetch('/api/profile', {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${sessionToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(profileUpdate)
                });
                
                if (response.ok) {
                    showStatus('Profile updated successfully!', 'success');
                    // Reload profile data to reflect changes
                    await loadProfileData();
                } else {
                    throw new Error('Failed to update profile');
                }
                
            } catch (error) {
                console.error('Profile update error:', error);
                showStatus('Failed to update profile. Please try again.', 'error');
            }
        });

        function resetForm() {
            if (confirm('Are you sure you want to reset all changes?')) {
                populatePersonalInfoForm();
            }
        }

        // Create profile particles animation
        function createProfileParticles() {
            const particlesContainer = document.getElementById('profileParticles');
            const particleCount = 15;
            
            setInterval(() => {
                const particle = document.createElement('div');
                particle.className = 'profile-particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = '0s';
                particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
                particlesContainer.appendChild(particle);
                
                setTimeout(() => {
                    if (particle.parentNode) {
                        particle.parentNode.removeChild(particle);
                    }
                }, 25000);
            }, 2000);
        }
    </script>
</body>
</html>
